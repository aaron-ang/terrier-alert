name: Service Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - run: ruff check --output-format=github .

      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      # Live BU tests are opt-in (pytest -m live) so a BU outage cannot block merges
      - run: python -m pytest -m "not live"

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Needs secrets, which pull requests from forks do not get
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5

      - name: Start service
        env:
          TEST_TELEGRAM_TOKEN: ${{ secrets.TEST_TELEGRAM_TOKEN }}
          FEEDBACK_CHANNEL_ID: ${{ secrets.FEEDBACK_CHANNEL_ID }}
          MONGO_URL: ${{ secrets.MONGO_URL }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: docker compose up --build --detach --wait --wait-timeout 90

      - name: Check service stays healthy for 60s
        run: |
          for _ in $(seq 12); do
            sleep 5
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q bot)" 2>/dev/null || echo exited)
            if [ "$status" != healthy ]; then
              echo "Service is $status"
              exit 1
            fi
          done
          echo "Service stayed healthy for 60s"

      - name: Show logs
        if: always()
        run: docker compose logs

      - name: Stop service
        if: always()
        run: docker compose down

  deploy:
    needs: [lint, test, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --retry 3 --output /dev/null "$DEPLOY_URL"
